<head>
  <meta charset="UTF-8" />

  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('muwanshots-theme');
        var theme = stored === 'light' || stored === 'dark' ? stored : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch(e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <!-- Primary Meta Tags -->
  <title>Muwan Shots Photography - Photography & Videography in Masaka & Kampala</title>
  <meta name="title" content="Muwan Shots - Photography & Videography in Masaka & Kampala" />
  <meta name="description" content="Professional photography and videography in Masaka & Kampala, Uganda. Weddings, kukyala, graduations, birthdays, corporate and cinematic storytelling." />
