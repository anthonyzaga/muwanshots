name: Media Optimize

on:
  workflow_dispatch:
  schedule:
    # Near-real-time within free tier: every 15 minutes (lowest practical without per-minute abuse)
    # Previous 6h was too slow for user expectation (pending→ready in <15m ideally)
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'functions/api/photos/upload.js'
      - 'functions/lib/r2.js'
      - 'scripts/optimize-upload.mjs'
      - '.github/workflows/media-optimize.yml'

concurrency:
  group: media-optimize
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install wrangler
        run: npm install -g wrangler@4
      - name: Check pending count (skip if none, save minutes)
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PENDING=$(npx wrangler d1 execute muwanshots-db --remote --command "SELECT COUNT(*) as c FROM photos WHERE processing_status IN ('pending','failed')" --json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['results'][0]['c'] if d and d[0]['results'] else 0)")
          echo "pending=$PENDING" >> $GITHUB_OUTPUT
          echo "Pending: $PENDING"
      - name: Optimize pending media (remote)
        if: steps.check.outputs.pending != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          # Requires CLOUDFLARE_API_TOKEN with D1 and R2 permissions
          # Processes both pending and failed (failed will be retried if still pending logic; failed stays failed until manual retry)
          # Use --all-pending (includes pending only, per script logic)
          node scripts/optimize-upload.mjs --all-pending --remote
      - name: Verify (pending/failed counts)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute muwanshots-db --remote --command "SELECT processing_status, COUNT(*) as cnt FROM photos GROUP BY processing_status" --json
          npx wrangler d1 execute muwanshots-db --remote --command "SELECT id, processing_status, processing_error FROM photos WHERE processing_status != 'ready' LIMIT 10" --json
